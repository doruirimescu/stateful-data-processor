# tox.ini — streamlined for tox v4

[tox]
minversion = 4.6
requires = tox>=4.6
envlist = py310

[vars]
# shared locations
docs_dir = {toxinidir}/docs
build_dir = {toxinidir}/docs/_build

# ----------------------------
# Test environments
# ----------------------------
[testenv]
description = Run unit tests
package = editable              # fast: install your package in editable mode
extras = testing                # uses [project.optional-dependencies].testing
setenv =
    TOXINIDIR = {toxinidir}
passenv =
    HOME
commands =
    python -m pytest {posargs}

# ----------------------------
# Docs
# ----------------------------
[testenv:docs]
description = Build Sphinx docs
package = skip
deps = -r {vars:docs_dir}/requirements.txt
setenv =
    DOCSDIR = {vars:docs_dir}
    BUILDDIR = {vars:build_dir}
commands =
    python -m sphinx -b html -d "{env:BUILDDIR}/doctrees" "{env:DOCSDIR}" "{env:BUILDDIR}/html" {posargs}

[testenv:doctests]
description = Run Sphinx doctests
package = skip
deps = -r {vars:docs_dir}/requirements.txt
setenv =
    DOCSDIR = {vars:docs_dir}
    BUILDDIR = {vars:build_dir}
commands =
    python -m sphinx -b doctest -d "{env:BUILDDIR}/doctrees" "{env:DOCSDIR}" "{env:BUILDDIR}/doctest" {posargs}

# ----------------------------
# Build / Clean
# ----------------------------
[testenv:clean]
description = Remove build artifacts
package = skip
skip_install = true
commands =
    python -c "from shutil import rmtree; [rmtree(p, True) for p in ('build','dist','docs/_build')]"

[testenv:build]
description = Build sdist and wheel
package = skip
skip_install = true
deps = build[virtualenv]
commands =
    python -m build .

# ----------------------------
# Publish
# ----------------------------
[testenv:publish]
description = Check and upload distribution archives
package = skip
skip_install = true
deps = twine
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_REPOSITORY
commands =
    python -m twine check dist/*
    python -m twine upload {posargs:--repository testpypi} dist/*
