# setup.cfg — tool-only configuration (no packaging metadata)

[tool:pytest]
addopts =
    --cov stateful_data_processor
    --cov-report term-missing
    --verbose
norecursedirs =
    dist
    build
    .tox
testpaths = tests
# markers =
#     slow: mark tests as slow
#     system: mark end-to-end system tests

[flake8]
max_line_length = 88
extend_ignore = E203, W503
exclude =
    .tox
    build
    dist
    .eggs
    docs/conf.py
